name: pwh_customer
description: "A Flutter BLoC clean architecture starter template."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  firebase_core: ^4.13.0
  flutter_bloc: ^9.1.1
  flutter_localization: ^0.4.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  intl: any
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  pinput: ^6.0.2
  talker_dio_logger: ^5.1.13
  talker_flutter: ^5.1.13
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_screenutil: ^5.9.3
  firebase_messaging: ^16.5.0
  awesome_notifications: ^0.12.1
  lottie: ^3.3.1
  url_launcher: ^6.3.1
dev_dependencies:
  bloc_concurrency: ^0.3.0
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.14.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/logo/
    - assets/lottie/

flutter_assets_generator:
  output_dir: gen/assets/
  output_filename: assets
  class_name: Assets
  auto_detection: true
  auto_add_dependencies: true
  # Options: robust (default), legacy (old style)
  style: legacy
  package_parameter_enabled: false
  named_with_parent: true
  path_ignore: [ ]

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/app_icon.png

  android_12:
    color: "#FFFFFF"
    image: assets/logo/app_icon.png
